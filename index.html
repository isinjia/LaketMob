<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>라스트 로이드 - LAST ROID v0.60</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #02040a; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  canvas { display: block; image-rendering: auto; box-shadow: 0 0 60px rgba(56, 225, 255, 0.12); outline: none; }
  #touchpad { display: none; position: fixed; inset: 0; pointer-events: none; }
  #touchpad .btn { position: absolute; pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; background: rgba(15, 30, 55, 0.55);
    border: 2px solid rgba(56, 225, 255, 0.6); color: #cff6ff; font: 800 20px 'Noto Sans KR', sans-serif; display: flex; align-items: center; justify-content: center; }
  #touchpad .btn.on { background: rgba(56, 225, 255, 0.45); }
  #touchpad .dpad { position: absolute; left: 18px; bottom: 18px; width: 192px; height: 192px; }
  #touchpad .dpad .btn { border-radius: 12px; }
  #touchpad [data-act=up] { left: 64px; top: 0; } #touchpad [data-act=down] { left: 64px; top: 128px; }
  #touchpad [data-act=left] { left: 0; top: 64px; } #touchpad [data-act=right] { left: 128px; top: 64px; }
  /* A·B는 같은 줄에 나란히(B 왼쪽, A 오른쪽), 자주 안 쓰는 RUN은 그 위에 작게 */
  #touchpad .ab { position: absolute; right: 18px; bottom: 26px; width: 176px; height: 128px; }
  #touchpad [data-act=a] { right: 0; top: 44px; width: 76px; height: 76px; border-color: #ffb22e; }
  #touchpad [data-act=b] { right: 92px; top: 50px; }
  #touchpad [data-act=run] { right: 54px; top: 0; width: 64px; height: 34px; border-radius: 17px; font-size: 13px; }
  #touchpad [data-act=menu] { position: absolute; right: 18px; top: 18px; width: 70px; height: 40px; border-radius: 10px; font-size: 14px; }
  /* 좁은 폰 화면: 방향키와 A/B 버튼이 겹치지 않도록 작게 */
  @media (max-width: 440px) {
    #touchpad .btn { width: 50px; height: 50px; font-size: 17px; }
    #touchpad .dpad { left: 12px; bottom: 16px; width: 150px; height: 150px; }
    #touchpad [data-act=up] { left: 50px; top: 0; } #touchpad [data-act=down] { left: 50px; top: 100px; }
    #touchpad [data-act=left] { left: 0; top: 50px; } #touchpad [data-act=right] { left: 100px; top: 50px; }
    #touchpad .ab { right: 12px; bottom: 18px; width: 146px; height: 108px; }
    #touchpad [data-act=a] { right: 0; top: 40px; width: 64px; height: 64px; }
    #touchpad [data-act=b] { right: 76px; top: 47px; }
    #touchpad [data-act=run] { right: 44px; top: 0; width: 56px; height: 30px; border-radius: 15px; font-size: 12px; }
    #touchpad [data-act=menu] { right: 12px; top: 12px; width: 64px; height: 36px; font-size: 13px; }
  }

  #mobile-field { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #mobile-field [hidden] { display:none !important; }
  #mobile-field button { position:absolute; pointer-events:auto; border:1px solid #ffffff38; color:#f1f7ff; background:#101f35df; border-radius:18px; padding:12px 18px; font:700 14px 'Noto Sans KR',sans-serif; box-shadow:0 4px 20px #0005; }
  #move-zone { position:absolute; inset:90px 0 0; pointer-events:auto; touch-action:none; }
  #floating-stick { position:fixed; width:100px; height:100px; transform:translate(-50%,-50%); border:1px solid #ffffff70; border-radius:50%; background:#10203955; pointer-events:none; }
  #floating-stick i { position:absolute; left:50%; top:50%; width:42px; height:42px; border-radius:50%; background:#d9f6ff99; border:1px solid #fff9; }
  #floating-stick.fast { border-color:#ffcd66; }
  #field-menu { right:16px; top:max(14px,env(safe-area-inset-top)); }
  #mobile-field #field-quest { left:14px; top:max(14px,env(safe-area-inset-top)); max-width:calc(100% - 94px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; padding:12px; text-align:left; }
  #field-action { right:20px; bottom:max(32px,env(safe-area-inset-bottom)); border-color:#ffce6a !important; }
  #field-confirm { right:20px; bottom:max(24px,env(safe-area-inset-bottom)); }
  #dex-prev { right:116px; bottom:max(24px,env(safe-area-inset-bottom)); }
  #dex-next { right:16px; bottom:max(24px,env(safe-area-inset-bottom)); }
  #field-back { left:16px; bottom:max(24px,env(safe-area-inset-bottom)); }
  .modern-touch #touchpad .dpad, .modern-touch #touchpad .ab, .modern-touch #touchpad [data-act=menu] { display:none; }
  .modern-touch:not(.modern-field):not(.portrait-field) #touchpad .dpad, .modern-touch:not(.modern-field):not(.portrait-field) #touchpad .ab { display:block; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="touchpad">
  <div class="dpad">
    <div class="btn" data-act="up">▲</div><div class="btn" data-act="down">▼</div>
    <div class="btn" data-act="left">◀</div><div class="btn" data-act="right">▶</div>
  </div>
  <div class="ab">
    <div class="btn" data-act="a">A</div><div class="btn" data-act="b">B</div><div class="btn" data-act="run">RUN</div>
  </div>
  <div class="btn" data-act="menu">MENU</div>
</div>
